<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0b101c"/>
  <meta name="description" content="LINGUA49 — 49 languages. Focused learning missions, active recall, and spaced repetition."/>
  <title>LINGUA49 · Learn with intention</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');
:root {--ink:#101522;--muted:#788093;--paper:#f6f8fb;--line:#e5eaf1;--nav:#0c1321;--blue:#4268fa;--blue-2:#7897ff;--teal:#17af9f;--orange:#ffab75;--radius:19px;--shadow:0 10px 32px rgba(21,35,65,.04)}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
button,select,input,textarea {font:inherit}
button{cursor:pointer;border:0}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a2b6ff;outline-offset:3px}
.app-shell{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:246px;flex-shrink:0;background:var(--nav);padding:34px 20px 20px;display:flex;flex-direction:column;color:#9eaaba}
.logo{display:flex;gap:10px;align-items:center;padding:0 11px;margin-bottom:45px;color:#fff;font-family:Outfit,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.8px}
.logo-symbol{width:35px;height:35px;display:grid;place-items:center;color:#fff;border-radius:12px;background:linear-gradient(135deg,#59a5ff,#7c5dff);font-size:19px;box-shadow:0 4px 16px #345cb947}
.logo small{font-size:10px;vertical-align:top;color:#a7baff;letter-spacing:0;margin-left:2px}
.nav-caption{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#607184;margin:0 12px 10px}
.nav-links{display:grid;gap:6px}
.nav-link{display:flex;align-items:center;gap:13px;width:100%;border-radius:12px;padding:12px 14px;text-align:left;color:#91a0b5;background:transparent;font-weight:700;font-size:13px;transition:.15s}
.nav-link svg{width:18px;height:18px}
.nav-link:hover{background:#182338;color:white}
.nav-link.active{background:linear-gradient(90deg,#314d93,#243865);color:white;box-shadow:inset 3px 0 #78a4ff}
.nav-count{margin-left:auto;background:#36579e;color:white;border-radius:7px;padding:2px 7px;font-size:10px}
.sidebar-bottom{margin-top:auto;padding:16px 6px 4px}
.sidebar-note{background:#162438;border:1px solid #263a57;padding:18px 15px;border-radius:17px;color:#bed0ef}
.sidebar-note .star{font-size:24px}
.sidebar-note h4{margin:7px 0 4px;font:700 14px Outfit}
.sidebar-note p{font-size:11px;color:#91a5c3;margin:0;line-height:1.6}
.sidebar-footer{font-size:10px;color:#61738a;margin-top:20px;padding:0 9px}
.main{min-width:0;flex:1;max-width:1700px;margin:0 auto;padding:30px 44px 65px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:31px}
.top-path{font-size:12px;font-weight:700;color:#8b92a2}
.top-path span{color:#273552}
.top-actions{display:flex;align-items:center;gap:12px}
.lang-select{display:flex;align-items:center;gap:10px;background:#fff;padding:8px 13px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.lang-select select{appearance:auto;border:0;background:transparent;max-width:185px;outline:none;color:#25334d;font-size:12px;font-weight:800;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:14px;background:#fce6df;display:grid;place-items:center;font-weight:800;color:#ba6b54;border:2px solid white;box-shadow:var(--shadow)}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:23px}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--blue)}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4{font-family:Outfit,'DM Sans',sans-serif;letter-spacing:-.5px}
h1{font-size:clamp(29px,3.2vw,39px);line-height:1.13;margin:8px 0 8px;font-weight:800}
h2{font-size:20px;margin-bottom:6px}
h3{font-size:17px;margin-bottom:7px}
.sub{color:#8b94a4;font-size:13px;margin-bottom:0}
.btn{border-radius:11px;padding:11px 17px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#eef1f8;color:#263452;font-size:12px;font-weight:800;white-space:nowrap;transition:transform .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#e2e9f6}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 7px 17px #4268fa2b}
.btn.primary:hover:not(:disabled){background:#2f55ea}
.btn.dark{background:#131e35;color:#fff}
.btn.ghost{background:transparent;color:#52637d;border:1px solid var(--line)}
.btn.orange{background:#ffeddc;color:#a05a24}
.btn.success{background:#dff6ed;color:#167858}
.btn.small{padding:8px 12px;font-size:11px}
.btn.block{width:100%}
.btn.circle{width:40px;height:40px;padding:0}
.card{background:white;border:1px solid #edf0f5;box-shadow:var(--shadow);border-radius:var(--radius);padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h2{margin:0;font-size:17px}
.card-head small{color:#9aa5b5;font-size:11px}
.hero{display:grid;grid-template-columns:1.35fr .7fr;position:relative;overflow:hidden;min-height:252px;border-radius:22px;background:linear-gradient(112deg,#17243f 0%,#243b6b 57%,#334a87 100%);color:white;padding:30px 34px 28px;box-shadow:0 15px 36px rgba(23,43,87,.12);margin-bottom:21px}
.hero:before{content:'';position:absolute;right:14%;top:-130px;width:310px;height:310px;border:1px solid #8ca7f42d;border-radius:50%;box-shadow:0 0 0 45px #8ca7f40d,0 0 0 100px #8ca7f409}
.hero:after{content:'';position:absolute;right:-70px;bottom:-145px;background:#9fb5ff19;width:335px;height:335px;border-radius:50%}
.hero > *{z-index:1;position:relative}
.hero .eyebrow{color:#a6befb}
.hero h2{font-size:clamp(27px,2.9vw,38px);line-height:1.08;letter-spacing:-1.2px;margin:13px 0}
.hero p{max-width:410px;color:#c5d1e9;font-size:13px;line-height:1.75;margin-bottom:20px}
.hero .btn{background:white;color:#26385c}
.hero-badge{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:10px;color:#c8e6ff;background:#ffffff15;border:1px solid #ffffff27;padding:7px 10px;border-radius:50px}
.hero-art{display:flex;align-items:center;justify-content:center}
.hero-ring{width:185px;height:185px;border-radius:50%;border:12px solid #ffffff1a;display:grid;place-items:center;background:radial-gradient(circle,#cbd8ff29,#ffffff09);transform:rotate(-12deg)}
.hero-ring strong{font:800 70px Outfit;color:white;filter:drop-shadow(0 10px 16px #0004)}
.hero-ring .dot{position:absolute;width:38px;height:38px;background:#ffad7c;border:7px solid #f8d1a6;border-radius:50%;right:-15px;top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:21px}
.stat{padding:19px 21px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.stat .label{color:#8b96a6;font-size:11px;font-weight:700;margin:0 0 10px}
.stat strong{font:800 27px Outfit;letter-spacing:-1px}
.stat .hint{display:block;font-size:10px;color:#a0abba;margin-top:3px}
.stat-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e9f0ff;color:#5174ec;flex-shrink:0}
.stat-icon svg{width:18px;height:18px}
.stat:nth-child(2) .stat-icon{background:#e9f8f2;color:#1da882}
.stat:nth-child(3) .stat-icon{background:#fff2ea;color:#e59155}
.stat:nth-child(4) .stat-icon{background:#f1edff;color:#9873e1}
.two-col{display:grid;grid-template-columns:1.25fr .85fr;gap:21px;margin-bottom:21px}
.progress-track{height:8px;background:#edf0f7;border-radius:50px;overflow:hidden}
.progress-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,#487af9,#40c3bd);transition:width .3s}
.week-list{display:grid;gap:16px}
.week-line{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:11px;font-weight:800}
.week-line .muted{font-weight:600;color:#a1abba}
.small-muted{font-size:11px;color:#8b95a6}
.review-empty{text-align:center;padding:25px 15px;color:#8d98a8;font-size:13px}
.review-empty .emoji{font-size:31px;margin-bottom:8px}
.review-row{display:flex;align-items:center;gap:13px;border-bottom:1px solid #eff2f7;padding:11px 0}
.review-row:last-child{border-bottom:0}
.review-letter{display:grid;place-items:center;background:#eef3ff;color:#5878e5;width:39px;height:39px;border-radius:12px;font-family:Outfit;font-weight:800;font-size:18px}
.review-row strong{font-size:13px}
.review-row p{font-size:11px;color:#99a3b1;margin:3px 0 0}
.review-row .btn{margin-left:auto}
.timeline{display:flex;justify-content:space-between;gap:8px;position:relative;margin:24px 0 9px}
.timeline:before{content:'';height:3px;background:#e8ecf3;position:absolute;top:18px;left:6%;right:6%}
.time-unit{display:flex;align-items:center;flex-direction:column;gap:9px;z-index:1;flex:1;text-align:center}
.time-dot{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#eef2f7;color:#8b97aa;font-size:12px;font-weight:800;border:4px solid white}
.time-dot.done{background:#27b596;color:white}
.time-dot.current{background:#4268fa;color:white;box-shadow:0 0 0 4px #e2e9ff}
.time-unit strong{font-size:11px}
.time-unit span{color:#9ba5b3;font-size:10px}
.practice-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.65fr);gap:21px}
.mission-box{border-radius:23px;background:#111e38;color:#fff;padding:27px;position:relative;overflow:hidden}
.mission-box:before{content:'✦';position:absolute;font-size:220px;color:#ffffff08;right:13px;top:-58px}
.mission-box .eyebrow{color:#96b4ff}
.mission-box h2{font-size:27px;margin:9px 0 9px}
.mission-box p{color:#b9c6db;font-size:12px;max-width:460px}
.mission-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px}
.pill{display:inline-flex;gap:6px;align-items:center;background:#eaf0fa;color:#5870a0;padding:6px 10px;font-size:10px;font-weight:800;border-radius:50px}
.mission-box .pill{background:#ffffff19;color:#d4e0fa;border:1px solid #ffffff14}
.study-clock{text-align:center;border-radius:19px;padding:26px 20px;background:linear-gradient(135deg,#eaf1ff,#f3f1ff);border:1px solid #dce6fa}
.study-clock .clock{font:800 clamp(43px,5vw,62px) Outfit;letter-spacing:-2px;color:#213a77;line-height:1.1;margin:7px 0}
.study-clock p{font-size:12px;color:#8592ac;margin:5px 0 15px}
.stage-list{display:grid;gap:1px}
.stage{display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;font-size:11px;color:#8c96a8;font-weight:700}
.stage span{font-size:10px;color:#a0a9b6;white-space:nowrap}
.stage.active{background:#edf1ff;color:#3556bf}
.stage.done{color:#25a483}
.stage-icon{width:25px;text-align:center}
.stage .dur{margin-left:auto}
.question-card{padding:27px}
.question-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
.question-tag{border-radius:50px;background:#f0edff;color:#8060c9;padding:6px 11px;font-size:10px;font-weight:800}
.prompt-scene{background:linear-gradient(145deg,#e9f3ff,#f6f4ff);padding:27px 25px;border-radius:16px;min-height:145px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.prompt-scene:after{content:'“';font:800 180px Georgia;color:#5874bb0e;position:absolute;right:10px;top:-55px}
.prompt-scene .scene-label{font-size:10px;text-transform:uppercase;color:#7585a7;letter-spacing:1.6px;font-weight:800}
.prompt-scene .scene-main{font:700 clamp(22px,3vw,32px) Outfit;margin-top:9px;letter-spacing:-.6px;position:relative;z-index:1}
.prompt-scene .scene-sub{font-size:12px;color:#8997aa;margin:7px 0 0}
.input-label{display:block;font-weight:800;font-size:13px;margin:20px 0 10px}
.answer-input{width:100%;min-height:61px;border:1.5px solid #e2e8f3;border-radius:13px;padding:14px 16px;color:#15233e;background:#fcfdff;font-size:18px;font-weight:600;resize:vertical}
.answer-input:focus{outline:none;border-color:#6f91f8;box-shadow:0 0 0 4px #cbd8ff63}
.question-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.feedback{border-radius:13px;padding:16px;margin-top:15px;font-size:13px;background:#effaf5;color:#176d54;border:1px solid #ccebdd}
.feedback.bad{background:#fff4eb;color:#986137;border-color:#f5e1cc}
.feedback strong{display:block;margin-bottom:4px}
.native-text{font-size:24px;font-weight:700;word-break:break-word;line-height:1.5}
.transliteration{font-size:12px;color:#8590a2;margin-top:7px}
.srs-front{text-align:center;background:linear-gradient(125deg,#eaf1ff,#f7edff);border-radius:17px;padding:45px 18px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.srs-front small{color:#7e8db2;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1px}
.srs-front h2{font-size:clamp(25px,3vw,39px);margin:17px 0 0}
.grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}
.grade-btn{background:#f2f5fa;border-radius:12px;padding:12px 3px;color:#2d3850;font-size:12px;font-weight:800}
.grade-btn span{display:block;color:#9ba6b6;font-weight:600;font-size:10px;margin-top:4px}
.grade-btn:nth-child(1){background:#fff0ee;color:#d46d5b}
.grade-btn:nth-child(4){background:#e5f8f2;color:#1c9a78}
.review-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.review-summary strong{font:800 23px Outfit;display:block}
.review-summary small{font-size:10px;color:#9ba6b4}
.curriculum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.week-card{padding:24px}
.day-row{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #eef0f6}
.day-row:last-child{border-bottom:0}
.day-bubble{width:36px;height:36px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:#eef2fa;color:#7183a5;font-size:12px;font-weight:800}
.day-bubble.selected{background:#e6edff;color:#4164da}
.day-text{flex:1}
.day-text strong{font-size:12px}
.day-text p{color:#a0a9b6;margin:2px 0 0;font-size:10px}
.day-row button{background:none;color:#4569e3;font-size:11px;font-weight:800;padding:8px}
.phrase-table{width:100%;border-collapse:collapse}
.phrase-table th{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;color:#a3acbc;text-align:left;padding:13px 9px;border-bottom:1px solid #edf0f6}
.phrase-table td{font-size:13px;border-bottom:1px solid #f1f3f8;padding:12px 9px;vertical-align:middle}
.phrase-table tr:last-child td{border-bottom:0}
.phrase-table .target{font-weight:800;font-size:16px;line-height:1.6}
.phrase-table td .latin{display:block;color:#a5acba;font-size:10px;font-weight:500}
.field{display:grid;gap:8px;margin-bottom:16px}
.field label{font-size:12px;font-weight:800;color:#3c4a66}
.field input,.field select,.field textarea{border:1px solid #e0e7f1;border-radius:11px;padding:12px 13px;min-width:0;background:white;font-size:13px;color:#1d2c47}
.settings-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:19px 0;border-bottom:1px solid #eef0f6}
.settings-row:last-child{border-bottom:0}
.settings-row strong{display:block;font-size:13px}
.settings-row small{display:block;font-size:11px;color:#98a2b1;margin-top:4px;line-height:1.6}
.notice{background:#fff9ed;border:1px solid #f5e9cb;border-radius:12px;color:#997a3a;font-size:12px;padding:13px 15px;line-height:1.7;margin-bottom:19px}
.empty{padding:30px;text-align:center;color:#8c99ab}
.empty .empty-emoji{font-size:38px;margin-bottom:12px}
.empty h3{color:#2c3951}
.mobile-nav{display:none}
#toast{pointer-events:none;position:fixed;bottom:22px;right:22px;max-width:min(360px,calc(100vw - 30px));background:#132541;color:white;border:1px solid #526797;border-radius:13px;padding:12px 17px;box-shadow:0 10px 40px #15274a55;opacity:0;transform:translateY(10px);transition:.23s;z-index:30;font-size:12px;font-weight:700}
#toast.show{opacity:1;transform:translateY(0)}
.split-actions{display:flex;flex-wrap:wrap;gap:8px}
.fineprint{font-size:11px;color:#9aa4b4;line-height:1.75}
.progress-chart{display:flex;gap:10px;align-items:flex-end;height:125px;padding:12px 0 0}
.chart-col{flex:1;display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:8px;height:100%}
.chart-bar{width:100%;max-width:37px;min-height:5px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#7298ff,#4773f6)}
.chart-col span{font-size:10px;color:#9ba5b6}
.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:#21304a}
.footer-note{margin-top:23px;font-size:10px;color:#aab4c0}
@media(max-width:1150px){.sidebar{width:210px}.main{padding:26px 26px 70px}.hero{grid-template-columns:1fr .42fr}.hero-ring{width:130px;height:130px}.hero-ring strong{font-size:50px}.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.sidebar{display:none}.main{padding:19px 17px 95px}.topbar{margin-bottom:20px}.top-path{display:none}.lang-select{flex:1}.top-actions{width:100%}.lang-select select{max-width:100%;width:100%}.hero{grid-template-columns:1fr}.hero-art{display:none}.hero h2{font-size:32px}.two-col,.practice-layout,.curriculum-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:72px;background:#0e1727;z-index:20;justify-content:space-around;align-items:center;box-shadow:0 -8px 30px #0a102023;padding-bottom:env(safe-area-inset-bottom)}.mobile-link{background:transparent;color:#94a1bb;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:9px;font-weight:700}.mobile-link svg{width:20px;height:20px}.mobile-link.active{color:white}.page-heading{align-items:flex-start;flex-wrap:wrap}h1{font-size:29px}}
@media(max-width:470px){.card{padding:17px}.hero{padding:24px}.stat-grid{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.stat-icon{width:30px;height:30px}.question-card{padding:18px}.grade-grid{grid-template-columns:repeat(2,1fr)}.timeline{gap:0}.time-unit span{font-size:9px}.lang-select{padding:6px}.topbar .avatar{display:none}}


/* After-hours Side Quest experience */
.quest-teaser {position:relative;display:flex;align-items:center;justify-content:space-between;min-height:208px;padding:28px 34px;background:linear-gradient(120deg,#111b35 0%,#22274b 55%,#3f326a 100%);border:1px solid #313861;border-radius:20px;box-shadow:0 14px 45px rgba(23,29,55,.1);color:white;overflow:hidden;margin:20px 0 26px}
.quest-teaser>div:first-of-type:not(.quest-teaser-glow){position:relative;z-index:2}
.quest-teaser-glow {position:absolute;right:-10px;top:-100px;width:330px;height:350px;filter:blur(65px);background:radial-gradient(circle,#925be864,transparent 65%)}
.quest-teaser h2 {font-family:Outfit,sans-serif;font-size:27px;line-height:1.2;margin:9px 0}
.quest-teaser p {max-width:550px;color:#c9d0eb;font-size:12px;line-height:1.75;margin:0 0 19px}
.quest-teaser .btn.ghost {background:#ffffff18;color:white;border:1px solid #ffffff35}
.quest-teaser-emoji {font-size:88px;position:relative;z-index:1;filter:drop-shadow(0 5px 30px #b651ff55);transform:rotate(-9deg)}
.quest-eyebrow {font-size:10px;font-weight:800;letter-spacing:1.5px;color:#b3a3ff}
.quest-unlocked-tag {font-size:11px;border-radius:999px;background:#ecedff;color:#5745ad;font-weight:800;padding:10px 14px}
.quest-lock{background:linear-gradient(140deg,#101b36,#302658);color:white;border-radius:23px;padding:48px 25px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px;box-shadow:0 15px 60px #0c173224}
.quest-lock-icon{font-size:42px;background:#ffffff12;width:80px;height:80px;border:1px solid #ffffff30;border-radius:25px;display:grid;place-items:center;margin-bottom:12px}
.quest-lock h2{font:800 clamp(23px,3vw,35px) Outfit,sans-serif;margin:3px 0}
.quest-lock p{color:#d0d6ee;max-width:600px;font-size:13px;line-height:1.8}
.quest-lock strong{color:#c4b5fd;font-size:12px}
.quest-lock .btn{margin-top:5px}
.quest-unlock-track{width:min(100%,500px);height:10px;border-radius:99px;background:#ffffff20;overflow:hidden;margin:10px auto 0}
.quest-unlock-track div{height:100%;background:linear-gradient(90deg,#7c91ff,#d8a5ff);border-radius:inherit;transition:width .2s}
.quest-list{display:grid;gap:14px;margin:22px 0}
.quest-item{display:flex;align-items:center;gap:20px;padding:23px;background:#fff;border:1px solid #e7eaf2;border-radius:19px;box-shadow:var(--shadow)}
.quest-item-icon{font-size:35px;flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:19px;background:linear-gradient(140deg,#edf0ff,#f4eaff)}
.quest-item-body{flex:1;min-width:0}
.quest-item h3{font:800 20px Outfit,sans-serif;margin:5px 0 7px;color:#1d2540}
.quest-item p{font-size:12px;color:#7e899d;line-height:1.65;margin:0 0 12px}
.quest-card-foot{display:flex;flex-wrap:wrap;gap:12px}
.quest-stat{color:#5c6881;font-size:10px;font-weight:700}
.quest-item .btn {flex:none}
.quest-banner{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}
.quest-banner span{font-size:11px;font-weight:800;letter-spacing:.5px;padding:10px 15px;border-radius:999px;background:#e8eafb;color:#4d548f}
.quest-player{border-radius:23px;overflow:hidden;background:white;border:1px solid #e3e7f2;box-shadow:0 17px 53px rgba(26,31,55,.08)}
.quest-player-top{display:flex;justify-content:space-between;align-items:center;padding:17px 25px;background:#10182d;color:#dedfff;font-size:11px;font-weight:700}
.quest-player-top strong{font-size:14px;color:#faca7a;margin-left:5px}
.quest-progress{height:5px;background:#313957}
.quest-progress span{height:5px;background:linear-gradient(90deg,#7b8aff,#e19fff);display:block;transition:.3s}
.quest-scene{background:radial-gradient(ellipse at 83% 62%,#752f6d 0%,transparent 40%),linear-gradient(135deg,#14223e,#141927 70%);color:white;min-height:275px;position:relative;overflow:hidden}
.quest-scene::before{content:"";position:absolute;right:-5%;top:8%;width:220px;height:220px;border:30px solid #d4449340;border-radius:90px;transform:rotate(45deg);filter:blur(3px)}
.quest-scene::after{content:"";position:absolute;right:18%;bottom:-80px;width:230px;height:180px;border-radius:70px;box-shadow:0 0 70px #f4538c90;background:#ed5a9522;transform:rotate(-12deg)}
.quest-scene-content{position:relative;z-index:2;padding:29px 35px;max-width:740px}
.quest-scene-icon{font-size:49px;display:block;margin-bottom:15px;filter:drop-shadow(0 10px 20px #f33166aa)}
.quest-scene-kicker{font-size:10px;font-weight:800;color:#bea9ff;letter-spacing:2px}
.quest-scene h2{font:800 clamp(25px,4vw,38px) Outfit,sans-serif;margin:4px 0 11px}
.quest-scene p{font-size:13px;line-height:1.75;max-width:620px;color:#ced5e7;margin:0}
.quest-conversation{padding:30px;display:grid;gap:21px}
.quest-npc{display:flex;align-items:flex-start;gap:14px}
.quest-npc .quest-avatar{background:#1e2b48;border-radius:15px;color:#9fbaff;flex:none;width:48px;height:48px;display:grid;place-items:center}
.quest-npc span{display:block;font-size:10px;color:#8d93ac;font-weight:800;letter-spacing:1px;margin-bottom:5px}
.quest-npc p{display:inline-block;background:#f0f3fc;color:#1d2942;border-radius:0 15px 15px 15px;padding:15px 17px;font-size:15px;font-weight:700;margin:0;line-height:1.6}
.quest-task{border-left:3px solid #8967f6;padding-left:17px;margin:2px 0}
.quest-task h3{font:800 23px Outfit,sans-serif;color:#222b47;margin:7px 0}
.quest-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quest-option{display:flex;text-align:left;align-items:center;gap:11px;min-height:80px;border-radius:15px;border:1px solid #e1e7f3;background:#fff;color:#25304c;padding:12px;transition:transform .15s,background .15s,border-color .15s}
.quest-option:hover:not(:disabled){transform:translateY(-2px);border-color:#727eec;background:#f5f6ff}
.quest-option:focus-visible{outline:3px solid #8b9cff;outline-offset:2px}
.quest-option.solution{border-color:#30ab8f;background:#f0fdf8}
.quest-option-mark{display:grid;place-items:center;flex:none;background:#edf0ff;border-radius:10px;width:33px;height:33px;color:#4d5cc0;font-size:12px;font-weight:800}
.quest-option-text{flex:1;min-width:0}
.quest-option-text b{font-size:15px;overflow-wrap:anywhere;display:block}
.quest-option-text small{display:block;font-size:11px;color:#8592a4;margin-top:4px}
.quest-option-audio{color:#9daace}
.quest-player-actions{display:flex;flex-wrap:wrap;gap:10px}
.quest-result,.quest-hint{padding:15px 18px;border-radius:14px;font-size:12px;line-height:1.7}
.quest-result strong{font-size:13px}
.quest-result p{margin:5px 0 0}
.quest-result.success{background:#edfbf6;color:#176d5c;border:1px solid #c1efe3}
.quest-result.warning{background:#fff4ea;color:#985a23;border:1px solid #f6ddbf}
.quest-hint{background:#f1edff;color:#6b4dbb;border:1px solid #e8dbfc}
.quest-answer-meaning{margin-top:6px;font-size:11px;font-weight:700;opacity:.78}
.quest-finish{text-align:center;background:linear-gradient(150deg,#182349,#271c49);color:#fff;border-radius:23px;padding:48px 30px;margin-bottom:22px}
.quest-finish h2{font:800 31px Outfit,sans-serif;margin:9px 0}
.quest-finish p{max-width:600px;margin:15px auto;color:#cfd4e8;line-height:1.75;font-size:13px}
.quest-finish-stars{font-size:43px;color:#f2c46e;letter-spacing:10px}
.quest-finish-score{color:#cab7ff;font-size:12px;font-weight:800;margin:18px 0 21px}
.quest-finish .quest-player-actions{justify-content:center}
@media(max-width:800px){.quest-item{flex-wrap:wrap;gap:15px}.quest-item .btn{width:100%}.quest-teaser-emoji{font-size:57px}.quest-conversation{padding:21px}.quest-scene-content{padding:26px}.quest-player-top{padding:15px 20px}}
@media(max-width:520px){.quest-options{grid-template-columns:1fr}.quest-teaser{padding:23px}.quest-teaser-emoji{font-size:38px}.quest-teaser h2{font-size:23px}.quest-scene{min-height:285px}.quest-item h3{font-size:18px}.quest-lock{padding:31px 18px}}

/* Bilingual teaching language picker */
.select-caption{white-space:nowrap;font-size:10px;color:#7685a1;font-weight:800}
.top-actions .lang-select{min-width:0}
.top-actions select{min-width:80px;max-width:205px;text-overflow:ellipsis}
.top-actions{flex-wrap:wrap}
@media(max-width:800px){.top-actions{display:grid;grid-template-columns:1fr 1fr}.lang-select{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:2px}.lang-select select{width:100%;max-width:100%}}
@media(max-width:470px){.top-actions{grid-template-columns:1fr 1fr}.top-actions select{font-size:11px;min-width:0}}
html[dir=rtl] .app-shell{direction:rtl}
html[dir=rtl] .sidebar,html[dir=rtl] .main{text-align:right}
html[dir=rtl] .nav-link{text-align:right}
html[dir=rtl] .nav-count{margin-right:auto;margin-left:0}
html[dir=rtl] .page-heading{text-align:right}
html[dir=rtl] .quest-task{border-left:0;border-right:3px solid #8967f6;padding-left:0;padding-right:17px}
html[dir=rtl] .quest-option{text-align:right}
html[dir=rtl] .phrase-table th{text-align:right}
html[dir=rtl] .quest-npc p{border-radius:15px 0 15px 15px}
html[dir=rtl] .question-card textarea[dir=ltr],html[dir=rtl] .phrase-table [dir=ltr],html[dir=rtl] .quest-option b[dir=ltr]{text-align:left}
html[dir=rtl] .question-card textarea[dir=rtl],html[dir=rtl] .phrase-table [dir=rtl],html[dir=rtl] .quest-option b[dir=rtl]{text-align:right}

function tableForPhrases(qs){const d=currentData(),p=pack();return qs.length?`<div style="overflow:auto"><table class="phrase-table"><thead><tr><th>${html(t('meaningLabel'))}</th><th>${html(p.name)}</th><th></th></tr></thead><tbody>${qs.map(q=>`<tr><td>${safeMeaning(q.en)}${d.cards[q.id]?`<span style="display:block;color:#27a77e;font-size:10px;margin-top:3px">✓ Practiced</span>`:''}</td><td class="target" dir="${p.direction}" lang="${html(p.locale)}">${html(q.target)}${q.latin&&state.showLatin?`<span class="latin" dir="ltr">${html(q.latin)}</span>`:''}</td><td><button class="btn small ghost" data-action="speak" title="Play audio" data-phrase="${html(q.id)}">${icon('volume',14)}</button>${q.custom?` <button class="btn small ghost" data-action="delete-phrase" title="Delete custom phrase" data-phrase="${html(q.id)}">${icon('trash',14)}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No phrases found.</div>`}
function settingsPage(){return `${heading('YOUR PREFERENCES','Make it yours','Control your training pace and keep a backup of your progress.')}
<div class="two-col"><section class="card"><h2>${html(t('learningSettings'))}</h2><div class="settings-row"><div><strong>${html(t('instructionLanguage'))}</strong><small>${html(t('instructionHelp'))}</small></div><select id="study-from-settings" class="btn ghost" aria-label="${html(t('chooseBase'))}">${langSelectOptions()}</select></div><div class="settings-row"><div><strong>Programme length</strong><small>Exactly five 60-minute study days per week.</small></div><select id="programme-weeks" class="btn ghost"><option value="3" ${state.weeks===3?'selected':''}>3 weeks · 15h</option><option value="4" ${state.weeks===4?'selected':''}>4 weeks · 20h</option></select></div><div class="settings-row"><div><strong>Romanization hints</strong><small>Show pronunciation in Latin characters when provided.</small></div><label><input id="show-romanization" type="checkbox" ${state.showLatin?'checked':''} aria-label="Show romanization" style="width:20px;height:20px;accent-color:#4268fa"/></label></div><div class="settings-row"><div><strong>Audio speaking speed</strong><small>Slower speech can help with unfamiliar sounds.</small></div><select class="btn ghost" id="speech-rate">${[[.7,'Slow'],[.85,'Learning pace'],[1,'Normal']].map(([v,n])=>`<option value="${v}" ${state.speechRate===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="settings-row"><div><strong>Review algorithm</strong><small>SM-2-inspired spaced repetition, 0–5 recall ratings.</small></div><span class="pill">Enabled</span></div></section><section class="card"><h2>${html(t('dataPrivacy'))}</h2><p class="sub" style="line-height:1.8;margin:14px 0 20px">${html(t('privacyDesc'))}</p><div class="split-actions"><button class="btn primary" data-action="export-data">${icon('download')} ${html(t('export'))}</button><label class="btn ghost" for="import-file" style="cursor:pointer">${icon('upload')} ${html(t('import'))}</label><input type="file" accept="application/json,.json" id="import-file" hidden/></div><div style="height:20px"></div>${banner('Clearing browser storage or switching devices can erase unsynced progress. Export a backup before doing so.')}<button class="btn" data-action="reset-language" style="color:#ba4d51">${icon('trash')} ${html(t('reset'))} ${html(pack().name)}</button></section></div>`}

function sideQuestUnlocked(){return dailySec() >= 3600;}
function questById(id){return SIDE_QUESTS.find(q=>q.id===id)||SIDE_QUESTS[0]}
function questDailyRecord(){const data=currentData();data.sideQuests[today()] ||= {};return data.sideQuests[today()];}
function questRun(id){const todayData=questDailyRecord();return todayData[id] ||= {step:0,points:0,misses:0,perfect:0,chosen:null,hint:false,finished:false,startedAt:Date.now()};}
function phraseForQuestKey(key){
 const aliases={hello:['hello','greeting','good morning'],yes:['yes'],no:['no'],thanks:['thank you']};
 return pack().phrases.find(p=>(aliases[key]||[]).some(a=>p.en.toLowerCase()===a)) ||
 pack().phrases.find(p=>(aliases[key]||[]).some(a=>p.en.toLowerCase().startsWith(a+' ('))) ||
 pack().phrases.find(p=>(aliases[key]||[]).some(a=>p.en.toLowerCase().startsWith(a))) || null;
}
function questDialogue(quest,step){
 const special=QUEST_LOCALIZATIONS[quest.id]?.[state.language]?.[step];
 if(special)return {...special};
 const q=phraseForQuestKey(quest.steps[step].key);
 return q?{target:q.target,latin:q.latin,english:q.en}:null;
}
function questChoices(quest,step){
 const correct=questDialogue(quest,step);if(!correct)return [];
 const possible=[];
 for(let i=0;i<quest.steps.length;i++){
   const response=questDialogue(quest,i);
   if(response&&normalize(response.target)!==normalize(correct.target)&&!possible.some(x=>normalize(x.target)===normalize(response.target)))possible.push(response);
 }
 for(const q of pack().phrases){
  if(normalize(q.target)!==normalize(correct.target)&&!possible.some(x=>normalize(x.target)===normalize(q.target)))possible.push({target:q.target,latin:q.latin,english:q.en});
 }
 // Order changes by scene; stable after reload so the selected answer stays consistent.
 const shuffled=possible.sort((a,b)=>hashQuest(a.target,step+quest.id.length)-hashQuest(b.target,step+quest.id.length));
 const options=shuffled.slice(0,3);
 options.splice((step*7+quest.id.length)%(options.length+1),0,correct);
 return options;
}
function hashQuest(text,seed){let value=seed*29;for(const c of text)value=(Math.imul(value,31)+c.codePointAt(0))|0;return value>>>0;}
function sideQuestTeaser(){
 const unlocked=sideQuestUnlocked(),remaining=Math.max(0,3600-dailySec());
 return `<section class="quest-teaser"><div class="quest-teaser-glow"></div><div><div class="quest-eyebrow">✦ AFTER-HOURS BONUS · NO STUDY MINUTES USED</div><h2>${unlocked?'You unlocked Side Quests!':'Side Quests are waiting.'}</h2><p>${unlocked?'Enter a cinematic story, face surprising dialogue and unlock bonus stars.':'Complete your daily 60-minute mission to unlock interactive story challenges. '+Math.ceil(remaining/60)+' study minutes to go.'}</p><button class="btn ${unlocked?'primary':'ghost'}" data-view="sidequests">${icon(unlocked?'spark':'clock')} ${unlocked?'Play Side Quests':'Preview locked quests'} ${icon('arrow',15)}</button></div><div class="quest-teaser-emoji" aria-hidden="true">🚨</div></section>`;
}
function questCard(quest,run){
 const completed=!!run?.finished;
 const stateText=completed?'✓ CLEARED':sideQuestUnlocked()?'PLAY NOW':'🔒 LOCKED';
 return `<article class="quest-item"><div class="quest-item-icon">${quest.icon}</div><div class="quest-item-body"><div class="quest-eyebrow">${html(quest.tag)} · ${html(quest.level)}</div><h3>${html(quest.title)}</h3><p>${html(quest.summary)}</p><div class="quest-card-foot"><span class="quest-stat">${quest.steps.length} dialogue decisions</span><span class="quest-stat">${completed?run.points+' stars':'+500 possible stars'}</span></div></div><button class="btn ${sideQuestUnlocked()?'primary':'ghost'}" data-action="quest-select" data-quest="${html(quest.id)}" ${sideQuestUnlocked()?'':'disabled'}>${stateText}</button></article>`;
}
function questRating(run,quest){let ratio=run.points/(quest.steps.length*100);return ratio>=.85?3:ratio>=.6?2:1;}
function sideQuestPage(){
 const unlocked=sideQuestUnlocked(),remaining=Math.max(0,3600-dailySec()),quest=questById(state.sideQuestId);
 if(!unlocked)return `${heading('BONUS MISSIONS','Side Quests','Cinematic conversations unlock after a full, credited 60-minute study session.')}
   <div class="quest-lock"><div class="quest-lock-icon">🔐</div><div class="quest-eyebrow">BONUS CONTENT LOCKED</div><h2>${Math.ceil(remaining/60)} minutes until your next adventure</h2><p>Finish today’s ${html(pack().name)} study hour to play as long as you want. Side Quests never use up your 5-hour weekly learning limit.</p><div class="quest-unlock-track"><div style="width:${Math.min(100,Math.round(dailySec()/3600*100))}%"></div></div><strong>${fmtSec(dailySec())} / 01:00:00 completed</strong><button class="btn primary" data-view="learn">Continue daily lesson ${icon('arrow')}</button></div>
   <div class="quest-list">${SIDE_QUESTS.map(q=>questCard(q,null)).join('')}</div>`;
 const run=questRun(quest.id);
 return `${heading('AFTER-HOURS BONUS','Side Quests',`Full hour complete in ${html(pack().name)}. Now your choices tell the story — without affecting your weekly time budget.`,`<span class="quest-unlocked-tag">✦ BONUS UNLOCKED</span>`)}
 <div class="quest-banner"><span>★ ${Object.values(questDailyRecord()).reduce((s,r)=>s+(r.finished?r.points:0),0)} EARNED TODAY</span><span>${Object.values(questDailyRecord()).filter(q=>q.finished).length} / ${SIDE_QUESTS.length} STORIES CLEARED</span><span>∞ BONUS TIME</span></div>
 ${questPlayer(quest,run)}<div class="quest-list">${SIDE_QUESTS.map(q=>questCard(q,questDailyRecord()[q.id])).join('')}</div>
 <p class="fineprint" style="margin-top:14px">${html(t('narrationNote'))}</p>`;
}
function questPlayer(quest,run){
 if(run.finished)return `<section class="quest-finish"><span style="font-size:46px">🏆</span><div class="quest-eyebrow">MISSION CLEARED · ${html(quest.tag)}</div><h2>${html(quest.title)}</h2><div class="quest-finish-stars">${'★'.repeat(questRating(run,quest))}${'☆'.repeat(3-questRating(run,quest))}</div><p>${html(quest.finale)}</p><div class="quest-finish-score">${run.points} / ${quest.steps.length*100} stars · ${run.misses} misses</div><div class="quest-player-actions"><button class="btn primary" data-action="quest-restart">${html(t('replay'))} ${icon('rotate')}</button><button class="btn ghost" data-action="quest-back">${html(t('otherStories'))}</button></div></section>`;
 const step=quest.steps[run.step],good=run.chosen==='correct',bad=run.chosen==='wrong',progress=Math.round((run.step)/quest.steps.length*100);
 const current=questDialogue(quest,run.step),opts=questChoices(quest,run.step);
 return `<section class="quest-player">
   <div class="quest-player-top"><span class="quest-eyebrow">${html(quest.tag)} / EPISODE ${String(run.step+1).padStart(2,'0')}</span><span>STARS <strong>★ ${run.points}</strong></span></div>
   <div class="quest-progress"><span style="width:${progress}%"></span></div>
   <div class="quest-scene"><div class="quest-scene-overlay"></div><div class="quest-scene-content"><span class="quest-scene-icon">${quest.icon}</span><span class="quest-scene-kicker">SCENE ${run.step+1} OF ${quest.steps.length}</span><h2>${html(quest.title)}</h2><p>${html(run.step===0?quest.intro:quest.steps[run.step-1].after)}</p></div></div>
   <div class="quest-conversation"><div class="quest-npc"><div class="quest-avatar">${icon('mic',21)}</div><div><span>${html(step.speaker)}</span><p>${html(step.line)}</p></div></div>
     <div class="quest-task"><div class="quest-eyebrow">${html(t('questTask'))} ${html(pack().name)}</div><h3>${html(t('needSay'))} ${safeMeaning({hello:"Hello",yes:"Yes",no:"No",thanks:"Thank you"}[step.key])}</h3><span class="small-muted">${html(t('pick'))}</span></div>
     <div class="quest-options">${opts.map((o,i)=>`<button class="quest-option ${run.chosen&&current&&normalize(o.target)===normalize(current.target)?'solution':''}" data-action="quest-answer" data-choice="${i}" ${good?'disabled':''}><span class="quest-option-mark">${String.fromCharCode(65+i)}</span><span class="quest-option-text"><b lang="${html(pack().locale)}" dir="${pack().direction}">${html(o.target)}</b>${state.showLatin&&o.latin?`<small dir="ltr">${html(o.latin)}</small>`:''}</span><span class="quest-option-audio">${icon('volume',16)}</span></button>`).join('')}</div>
     ${run.hint&&!good?`<div class="quest-hint">${html(t('hint'))}: <strong>${safeMeaning(current?.english||step.task)}</strong>${current?.latin&&state.showLatin?' · '+html(current.latin):''}</div>`:''}
     ${good?`<div class="quest-result success"><strong>✓ Nailed it. +${run.lastPoints||100} stars</strong><p>${html(step.after)}</p><div class="quest-answer-meaning">${safeMeaning(current?.english||step.task)}</div></div>`:bad?`<div class="quest-result warning"><strong>${html(t('notQuite'))}</strong><p>${html(t('tryAgain'))}</p></div>`:''}
     <div class="quest-player-actions">${good?`<button class="btn primary" data-action="quest-next">${run.step===quest.steps.length-1?t('finishQuest'):t('continueStory')} ${icon('arrow')}</button>`:`<button class="btn ghost" data-action="quest-hint">${icon('spark')} ${html(t('showHint'))}</button>`}<button class="btn ghost" data-action="quest-restart">${icon('rotate')} ${html(t('restart'))}</button></div>
   </div></section>`;
}
function selectQuest(id){if(!sideQuestUnlocked()){toast('Finish your daily 60-minute lesson to unlock Side Quests.');return;}if(!SIDE_QUESTS.some(q=>q.id===id))return;state.sideQuestId=id;questRun(id);save();navigate('sidequests');}
function answerQuest(idx){
 if(!sideQuestUnlocked())return;
 const quest=questById(state.sideQuestId),run=questRun(quest.id);
 if(run.finished||run.chosen==='correct')return;
 const options=questChoices(quest,run.step),selected=options[idx],expected=questDialogue(quest,run.step);
 if(!selected||!expected)return;
 speech(selected);
 if(normalize(selected.target)===normalize(expected.target)){
   run.chosen='correct';run.lastPoints=run.chosenBeforeWrong?60:100;run.points+=run.lastPoints;if(!run.chosenBeforeWrong)run.perfect++;
 }else{run.chosen='wrong';run.misses++;run.chosenBeforeWrong=true;}
 save();renderShell();
}
function advanceQuest(){if(!sideQuestUnlocked())return;const quest=questById(state.sideQuestId),run=questRun(quest.id);if(run.chosen!=='correct'||run.finished)return;run.step++;run.chosen=null;run.hint=false;run.chosenBeforeWrong=false;if(run.step>=quest.steps.length){run.finished=true;toast('Side Quest cleared! Your bonus stars are saved.');}save();renderShell();}

function navigate(view){state.view=view;save();window.scrollTo({top:0,behavior:'instant'});renderShell()}
function speech(q){if(!q)return;const synth=window.speechSynthesis;if(!synth){toast('Speech playback is not supported in this browser.');return}const u=new SpeechSynthesisUtterance(q.target);u.lang=pack().locale;u.rate=state.speechRate;u.pitch=1;synth.cancel();const voices=synth.getVoices();const exact=voices.find(v=>v.lang.toLowerCase()===pack().locale.toLowerCase())||voices.find(v=>v.lang.toLowerCase().split('-')[0]===pack().locale.toLowerCase().split('-')[0]);if(exact)u.voice=exact;else toast('No matching device voice found; pronunciation may be inaccurate.');synth.speak(u);}
function normalize(str){return str.normalize('NFKC').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!？?。؛،¿¡'’"\-־]/g,'').replace(/\s+/g,' ').trim()}
function schedule(id,rating){const d=currentData(),prior=d.cards[id]||{ease:2.5,interval:0,reps:0,lapses:0,correct:0,wrong:0};let r={...prior};if(rating<3){r.reps=0;r.lapses++;r.interval=0;r.due=Date.now()+10*60*1000;r.wrong++}else{r.reps++;if(r.reps===1)r.interval=rating===5?3:1;else if(r.reps===2)r.interval=rating===5?9:rating===3?4:6;else r.interval=Math.max(1,Math.round(r.interval*r.ease));r.ease=Math.max(1.3,r.ease+.1-(5-rating)*(.08+(5-rating)*.02));r.due=Date.now()+r.interval*86400*1000;r.correct++}r.last=Date.now();d.cards[id]=r;save()}
function checkAnswer(revealed=false){if(practice.feedback)return;const q=getPhrase(),el=document.querySelector('#answer');if(!q)return;const value=el?.value?.trim()||practice.draft;if(!revealed&&!value){toast('Try an answer, or reveal the expression.');return}let guess=normalize(value),correct=!revealed&&(guess===normalize(q.target)||(q.latin&&guess===normalize(q.latin)));practice.feedback={correct,shown:revealed};practice.draft=value;practice.answered++;practice.total++;const d=currentData();d.attempts++;if(correct){d.correct++;practice.passed++}else d.mistakes++;schedule(q.id,correct?(practice.hint?3:4):1);save();renderShell();}
function nextQuestion(){practice.index++;practice.draft='';practice.feedback=null;practice.hint=false;renderShell();let input=document.querySelector('#answer');input?.focus();}
function markTime(){if(!clockRunning)return;let date=today(),d=currentData(),remaining=remainingSec();if(remaining<=0){clockRunning=false;toast('Study time cap reached — great work!');renderShell();return}let updated=Math.min(1,remaining);d.secondsByDate[date]=(d.secondsByDate[date]||0)+updated;if(updated){d.studiedDates[date]=true}save();refreshClockLabels();if(remainingSec()<=0){clockRunning=false;if(sideQuestUnlocked()){state.view='sidequests';save();toast('60 minutes complete! Side Quests unlocked.');}else toast('Your study budget is complete.');renderShell()}}
function refreshClockLabels(){const el=document.querySelector('#clock-primary');if(el)el.textContent=fmtSec(remainingSec());}
function toggleClock(){if(clockRunning){clockRunning=false;toast('Focus timer paused.');}else if(remainingSec()===0){toast('No focus time remains today or this week.');return}else {clockRunning=true;lastInteraction=Date.now();toast('Focus timer running. Keep practicing!');}renderShell()}
function exportData(){const blob=new Blob([JSON.stringify({app:'LINGUA49',version:3,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LINGUA49-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup downloaded.');}
function handleAction(e){let b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
if(act==='quest-select')return selectQuest(b.dataset.quest);
if(act==='quest-answer')return answerQuest(Number(b.dataset.choice));
if(act==='quest-next')return advanceQuest();
if(act==='quest-hint'){if(!sideQuestUnlocked())return;questRun(state.sideQuestId).hint=true;save();return renderShell();}
if(act==='quest-restart'){if(!sideQuestUnlocked())return;questDailyRecord()[state.sideQuestId]={step:0,points:0,misses:0,perfect:0,chosen:null,hint:false,finished:false,startedAt:Date.now()};save();return renderShell();}
if(act==='quest-back'){document.querySelector('.quest-list')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(act==='toggle-clock')return toggleClock();
if(act==='speak'){const q=cards().find(x=>x.id===b.dataset.phrase);return speech(q)}
if(act==='hint'){practice.hint=true;return renderShell()}
if(act==='check-answer')return checkAnswer();
if(act==='reveal-answer')return checkAnswer(true);
if(act==='next-question')return nextQuestion();
if(act==='reveal-review'){review.reveal=true;return renderShell()}
if(act==='grade'){let q=dueCards()[0];if(!q)return;let rating=Number(b.dataset.rating);schedule(q.id,rating);review.count++;review.reveal=false;toast(rating<3?'Scheduled another look in 10 minutes.':'Review saved and next date optimized.');return renderShell()}
if(act==='choose-day'){state.selectedDay=Math.min(state.weeks*5,Number(b.dataset.day));practice={index:0,feedback:null,hint:false,draft:'',mode:'translate',passed:0,total:0,answered:0};save();navigate('learn');return}
if(act==='delete-phrase'){if(!confirm('Delete this custom phrase?'))return;const d=currentData();d.custom=d.custom.filter(q=>q.id!==b.dataset.phrase);delete d.cards[b.dataset.phrase];save();renderShell();toast('Custom phrase deleted.');return}
if(act==='export-data')return exportData();
if(act==='reset-language'){if(!confirm(`Reset ${pack().name} progress on this device?`))return;state.data[state.language]={secondsByDate:{},attempts:0,correct:0,studiedDates:{},cards:{},custom:[],mistakes:0};clockRunning=false;practice.index=0;save();renderShell();toast('Language progress reset.');return}
if(act==='use-mic'){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){toast('Speech recognition is unavailable here. Try Chrome with microphone permissions.');return}let recognition=new SpeechRecognition();recognition.lang=pack().locale;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=r=>{let trans=r.results[0][0].transcript;const el=document.querySelector('#answer');if(el){el.value=trans;practice.draft=trans;el.focus()}};recognition.onerror=()=>toast('Could not capture speech; check microphone permission.');try{recognition.start();toast('Listening now…')}catch{toast('Microphone is not available.')}return}
}
document.addEventListener('click',e=>{lastInteraction=Date.now();const nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}handleAction(e)});
document.addEventListener('input',e=>{lastInteraction=Date.now();if(e.target.id==='answer'){practice.draft=e.target.value}else if(e.target.id==='library-search'){let term=normalize(e.target.value);const entries=cards().filter(x=>normalize(x.en).includes(term)||normalize(meaning(x.en)).includes(term)||normalize(x.target).includes(term)||normalize(x.latin||'').includes(term));document.querySelector('#phrase-rows').innerHTML=tableForPhrases(entries)}});
document.addEventListener('change',e=>{lastInteraction=Date.now();const v=e.target.value;if(e.target.id==='study-from'||e.target.id==='study-from-settings'){if(!STUDY_FROM.some(l=>l.code===v))return;state.studyFrom=v;save();renderShell();toast(t('instructionLanguage')+': '+sourceLocale().native);return;}if(e.target.id==='language'){clockRunning=false;state.language=v;practice={index:0,feedback:null,hint:false,draft:'',mode:'translate',passed:0,total:0,answered:0};review={index:0,reveal:false,count:0,grades:[]};save();renderShell();toast(`Switched to ${pack().name}.`)}else if(e.target.id==='programme-weeks'){state.weeks=Number(v);state.selectedDay=Math.min(state.selectedDay,state.weeks*5);save();renderShell()}else if(e.target.id==='show-romanization'){state.showLatin=e.target.checked;save();renderShell()}else if(e.target.id==='speech-rate'){state.speechRate=Number(v);save();renderShell()}else if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;file.text().then(s=>{try{let data=JSON.parse(s);if(data.app!=='LINGUA49'||data.version!==3||typeof data.state?.data!=='object'||!data.state.language||!LANGUAGE_PACKS.some(p=>p.code===data.state.language))throw Error('Invalid backup');if(!confirm('Replace this device’s LINGUA49 progress with the backup?'))return;state={...basicState,...data.state};if(!STUDY_FROM.some(l=>l.code===state.studyFrom))state.studyFrom='en';clockRunning=false;save();renderShell();toast('Backup restored.')}catch{toast('That is not a valid LINGUA49 v3 backup.')}})}});
document.addEventListener('submit',e=>{if(e.target.id!=='add-phrase')return;e.preventDefault();const form=e.target,fd=new FormData(form);let en=String(fd.get('meaning')||'').trim(),target=String(fd.get('native')||'').trim(),latin=String(fd.get('latin')||'').trim();if(!en||!target)return;const id=state.language+'-custom-'+Date.now()+'-'+Math.floor(Math.random()*10000);currentData().custom.push({id,en,target,latin,custom:true});save();renderShell();toast('Phrase added — ready for practice!')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&state.view==='learn'&&!practice.feedback){e.preventDefault();checkAnswer()}lastInteraction=Date.now()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&clockRunning){clockRunning=false;save();toast('Focus timer paused while tab is hidden.');renderShell()}});
setInterval(()=>{if(clockRunning){if(Date.now()-lastInteraction>120000){clockRunning=false;toast('Focus paused after 2 minutes without interaction.');renderShell()}else if(document.visibilityState==='visible')markTime()}},1000);
renderShell();

</script>
